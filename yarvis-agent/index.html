<title>YARVIS — Núcleo Zoey OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --bg:#0a0806;
    --bg2:#0d0b08;
    --panel:#121009;
    --panel-2:#17140d;
    --line:rgba(255,122,26,.10);
    --line-strong:rgba(255,122,26,.28);
    --accent:#ff7a1a;
    --accent-2:#ffae5c;
    --accent-dim:#b8531a;
    --text:#ece6db;
    --muted:#8a8175;
    --muted-2:#5f594f;
    --good:#4ec98a;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono","Cascadia Code",Menlo,Monaco,Consolas,monospace;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--mono);font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  /* faint scan grid */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(circle at 45% 55%,#000 0%,transparent 78%);
    mask-image:radial-gradient(circle at 45% 55%,#000 0%,transparent 78%);
    opacity:.6;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:6;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0px,rgba(0,0,0,.14) 1px,transparent 1px,transparent 3px);
    mix-blend-mode:overlay;opacity:.5;
  }

  .app{position:relative;z-index:2;height:100vh;height:100dvh;display:grid;
    grid-template-columns:58px 1fr minmax(360px,440px);}

  /* ---- rail ---- */
  .rail{border-right:1px solid var(--line);display:flex;flex-direction:column;
    align-items:center;padding:18px 0;gap:22px;background:linear-gradient(180deg,var(--bg2),transparent);}
  .brand{width:34px;height:34px;border:1px solid var(--line-strong);border-radius:9px;
    display:grid;place-items:center;color:var(--accent);font-weight:700;letter-spacing:.5px;
    box-shadow:0 0 22px rgba(255,122,26,.18) inset;}
  .rail .dots{display:flex;flex-direction:column;gap:16px;margin-top:6px;color:var(--muted-2)}
  .rail .dots span{width:16px;height:16px;border-radius:5px;border:1px solid var(--line);display:grid;place-items:center;font-size:10px}
  .rail .foot{margin-top:auto;color:var(--muted-2);font-size:9px;writing-mode:vertical-rl;letter-spacing:2px;transform:rotate(180deg)}

  /* ---- stage ---- */
  .stage{position:relative;overflow:hidden;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 26px;
    border-bottom:1px solid var(--line);gap:16px;flex-wrap:wrap}
  .title{display:flex;align-items:baseline;gap:12px}
  .title h1{margin:0;font-size:19px;letter-spacing:5px;font-weight:700;color:var(--text)}
  .title .tm{color:var(--accent);font-size:11px;transform:translateY(-6px)}
  .title small{color:var(--muted);letter-spacing:2px;font-size:10px}
  .status{display:flex;align-items:center;gap:18px;color:var(--muted);font-size:11px;letter-spacing:1.5px}
  .pill{display:inline-flex;align-items:center;gap:8px}
  .led{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good)}
  .led.warn{background:var(--accent);box-shadow:0 0 10px var(--accent)}
  #clock{color:var(--accent-2);font-variant-numeric:tabular-nums}

  .core-wrap{flex:1;position:relative;display:grid;place-items:center;min-height:0}
  canvas#core{display:block;width:100%;height:100%;position:absolute;inset:0}
  .core-label{position:absolute;bottom:5%;left:0;right:0;text-align:center;pointer-events:none}
  .core-label .big{font-size:15px;letter-spacing:8px;color:var(--accent)}
  .core-label .wave{margin:10px auto 0;width:220px;height:26px}
  .hint{position:absolute;top:16px;left:0;right:0;text-align:center;color:var(--muted-2);font-size:10px;letter-spacing:3px;pointer-events:none}

  /* boot overlay */
  #boot{position:absolute;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;
    justify-content:center;padding:0 12% ;gap:6px;font-size:12px;color:var(--muted);letter-spacing:1px}
  #boot .ok{color:var(--good)}
  #boot .b{color:var(--accent)}
  #boot.done{opacity:0;pointer-events:none;transition:opacity .7s ease}

  /* ---- console ---- */
  .console{border-left:1px solid var(--line);background:
    linear-gradient(180deg,var(--panel),var(--bg2));display:flex;flex-direction:column;min-height:0}
  .c-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .c-head .av{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#160b02;display:grid;place-items:center;font-weight:700;box-shadow:0 0 16px rgba(255,122,26,.5)}
  .c-head b{letter-spacing:2px}
  .c-head .sub{color:var(--muted);font-size:10px;letter-spacing:1px;margin-left:auto}

  .log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
  .log::-webkit-scrollbar{width:8px}
  .log::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px}
  .msg{display:flex;gap:10px;max-width:100%}
  .msg .who{flex:0 0 26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700}
  .msg.ai .who{background:rgba(255,122,26,.12);color:var(--accent);border:1px solid var(--line-strong)}
  .msg.me .who{background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.12)}
  .bubble{border-radius:12px;padding:11px 14px;border:1px solid var(--line);font-size:13px}
  .msg.ai .bubble{background:var(--panel-2)}
  .msg.me{flex-direction:row-reverse}
  .msg.me .bubble{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08)}
  .bubble h4{margin:0 0 6px;font-size:12px;letter-spacing:1px;color:var(--accent-2);text-transform:uppercase}
  .bubble p{margin:0 0 8px}.bubble p:last-child{margin:0}
  .bubble ul{margin:6px 0 0;padding-left:18px}.bubble li{margin:2px 0}
  .bubble table{border-collapse:collapse;width:100%;margin-top:8px;font-size:12px}
  .bubble th,.bubble td{border:1px solid var(--line-strong);padding:6px 8px;text-align:left;vertical-align:top}
  .bubble th{color:var(--accent);letter-spacing:.5px}
  .bubble .src{margin-top:9px;font-size:10px;color:var(--muted-2);letter-spacing:1px}
  .cursor::after{content:"▌";color:var(--accent);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:10px 18px 4px}
  .chip{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:20px;
    padding:6px 12px;font-family:var(--mono);font-size:11px;cursor:pointer;transition:.15s;letter-spacing:.5px}
  .chip:hover{color:var(--accent);border-color:var(--line-strong);background:rgba(255,122,26,.06)}

  .composer{padding:14px 16px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .field{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line-strong);
    border-radius:12px;padding:6px 6px 6px 14px}
  .field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,122,26,.12)}
  .field input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font-family:var(--mono);font-size:13px}
  .field input::placeholder{color:var(--muted-2)}
  .send{width:34px;height:34px;border-radius:9px;border:0;cursor:pointer;background:var(--accent);color:#160b02;
    font-size:16px;display:grid;place-items:center;transition:.15s}
  .send:hover{background:var(--accent-2)}
  .composer .meta{display:flex;align-items:center;justify-content:space-between;color:var(--muted-2);font-size:10px;letter-spacing:1px}
  .togg{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;color:var(--muted)}
  .togg input{accent-color:var(--accent)}

  @media (max-width:900px){
    body{overflow:auto}
    .app{grid-template-columns:1fr;height:auto;min-height:100dvh}
    .rail{flex-direction:row;justify-content:space-between;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}
    .rail .foot{writing-mode:horizontal-tb;transform:none;margin-top:0}
    .rail .dots{flex-direction:row}
    .core-wrap{height:44vh}
    .console{border-left:0;border-top:1px solid var(--line);height:70vh}
  }
  @media (prefers-reduced-motion:reduce){.cursor::after{animation:none}}
</style>

<div class="app">
  <!-- rail -->
  <nav class="rail" aria-label="navegación">

    <div class="dots" aria-hidden="true">

  <section class="stage">

      </div>
      <div class="status">

<script>
"use strict";
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;

/* ============ CLOCK ============ */
const clockEl = document.getElementById("clock");
setInterval(()=>{clockEl.textContent=new Date().toLocaleTimeString("es-ES",{hour12:false});},1000);

/* ============ CORE PARTICLE SPHERE ============ */
const cv = document.getElementById("core"), cx = cv.getContext("2d");
let W,H,DPR;
function fit(){
  DPR=Math.min(devicePixelRatio||1,2);
  const r=cv.getBoundingClientRect();
  W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",fit);fit();

// fibonacci sphere points
const N=760, pts=[];
for(let i=0;i<N;i++){
  const y=1-(i/(N-1))*2, r=Math.sqrt(1-y*y), t=i*2.399963;
  pts.push([Math.cos(t)*r,y,Math.sin(t)*r]);
}
let energy=0;           // 0 idle → 1 speaking
let targetEnergy=0;
let rot=0;

function draw(ts){
  cx.clearRect(0,0,W,H);
  energy += (targetEnergy-energy)*0.06;
  const cxp=W/2, cyp=H*0.52;
  const R=Math.min(W,H)*0.30;
  rot += reduce?0.0015:(0.0032+energy*0.006);
  const ax=Math.sin(ts/4200)*0.35;      // gentle wobble
  const cosR=Math.cos(rot),sinR=Math.sin(rot);
  const cosX=Math.cos(ax),sinX=Math.sin(ax);
  const puls=1+Math.sin(ts/900)*0.02+energy*0.06;

  // outer HUD arcs
  cx.save();cx.translate(cxp,cyp);
  for(let a=0;a<3;a++){
    cx.beginPath();
    const rr=R*(1.28+a*0.14)*puls;
    const start=rot*(a%2?-1:1.4)+a;
    cx.arc(0,0,rr,start,start+Math.PI*(0.5+a*0.18));
    cx.strokeStyle=`rgba(255,122,26,${0.20-a*0.05})`;cx.lineWidth=1;cx.stroke();
  }
  cx.beginPath();cx.arc(0,0,R*1.62*puls,0,Math.PI*2);
  cx.strokeStyle="rgba(255,122,26,.06)";cx.lineWidth=1;cx.stroke();
  cx.restore();

  // sphere points
  for(let i=0;i<N;i++){
    let [x,y,z]=pts[i];
    let x1=x*cosR - z*sinR, z1=x*sinR + z*cosR;
    let y1=y*cosX - z1*sinX, z2=y*sinX + z1*cosX;
    const noise=1+ (energy*0.10)*Math.sin(i*12.9+ts/260);
    const px=cxp + x1*R*puls*noise;
    const py=cyp + y1*R*puls*noise;
    const depth=(z2+1)/2;                 // 0 back → 1 front
    const size=depth*1.9+0.2;
    const alpha=0.12+depth*0.78;
    const hot = depth>0.72;
    cx.beginPath();cx.arc(px,py,size,0,6.283);
    cx.fillStyle= hot
      ? `rgba(255,${170+Math.round(depth*60)},${90+Math.round(depth*40)},${alpha})`
      : `rgba(255,122,26,${alpha})`;
    cx.fill();
  }

  // glowing core
  const g=cx.createRadialGradient(cxp,cyp,0,cxp,cyp,R*0.85);
  g.addColorStop(0,`rgba(255,150,60,${0.16+energy*0.22})`);
  g.addColorStop(1,"rgba(255,120,26,0)");
  cx.fillStyle=g;cx.beginPath();cx.arc(cxp,cyp,R*0.85,0,6.283);cx.fill();

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ============ VOICE WAVEFORM ============ */
const wv=document.getElementById("wave"),wc=wv.getContext("2d");
function waveFrame(ts){
  wc.clearRect(0,0,wv.width,wv.height);
  const mid=wv.height/2;wc.lineWidth=2;wc.strokeStyle="rgba(255,122,26,.75)";
  wc.beginPath();
  for(let x=0;x<wv.width;x++){
    const amp=(2+energy*22);
    const y=mid+Math.sin(x/16+ts/220)*amp*Math.sin(x/wv.width*Math.PI);
    x?wc.lineTo(x,y):wc.moveTo(x,y);
  }
  wc.stroke();requestAnimationFrame(waveFrame);
}
requestAnimationFrame(waveFrame);

function setState(speaking){
  targetEnergy=speaking?1:0;
  document.getElementById("stateTxt").textContent=speaking?"RESPONDIENDO":"EN REPOSO";
}

/* ============ KNOWLEDGE BASE (informe Zoey OS) ============ */
const KB=[
 {id:"zoey",kw:["que es zoey","zoey","plataforma","orquestadora","como funciona","general","que es"],
  html:`<h4>¿Qué es Zoey?</h4><p>Zoey es la <b>orquestadora central</b> del sistema. El usuario le pide algo y ella decide si lo resuelve directamente o lo <b>delega al companion más adecuado</b> según el tipo de tarea.</p><p>Junto a Zoey hay un equipo de <b>companions</b>: asistentes especializados con persona propia, expertise concreto (marketing, desarrollo, finanzas, investigación…) y un color de identificación único. Ahora mismo Marc tiene un companion, «Companion 8337», con rol de marketing.</p>`,
  src:"§1 · Plataforma"},
 {id:"companions",kw:["companion","companions","bots","bot","subagentes","subagente","paralelo","equipo","8337","10 bots"],
  html:`<h4>Companions y bots</h4><p>Cada companion puede tener hasta <b>10 bots propios</b>: subagentes enfocados en tareas muy concretas que trabajan <b>en paralelo</b>.</p><p>Se usan para trabajos grandes —analizar 20 documentos, generar contenido para varios canales a la vez— el companion reparte el trabajo entre sus bots y luego junta los resultados.</p>`,
  src:"§1 · Companions"},
 {id:"kb",kw:["base de conocimiento","conocimiento","documentos","carpetas","semantica","buscar","referencias","informes"],
  html:`<h4>Base de conocimiento</h4><p>Es el espacio donde Zoey guarda documentos, informes, planes o cualquier material generado en las conversaciones, organizados en <b>carpetas</b> y enlazados entre sí con referencias. Zoey puede buscar en ella de forma <b>semántica</b>, no solo por coincidencia exacta de palabras.</p><p>Ejemplo real: ahí quedó guardado el proyecto de la app de Electron para AlphaVision AI (main.js, package.json e instrucciones paso a paso).</p>`,
  src:"§2 · Conocimiento"},
 {id:"memoria",kw:["memoria","recuerda","preferencias","hechos","conversaciones pasadas","recall","fechas","duraderas"],
  html:`<h4>Memoria de Zoey</h4><p>Zoey guarda <b>hechos y preferencias duraderas</b> del usuario (por ejemplo, que a Marc le interesan desarrollo, marketing y finanzas). También puede recuperar conversaciones pasadas por tema o por rango de fechas, sin que el usuario tenga que repetir el contexto.</p>`,
  src:"§3 · Memoria"},
 {id:"integr",kw:["integraciones","integracion","gmail","calendario","slack","stripe","conectar","correos","eventos","herramientas externas"],
  html:`<h4>Integraciones</h4><p>La plataforma puede conectarse con herramientas externas como <b>Gmail, calendario, Slack o Stripe</b>, y ejecutar acciones reales sobre ellas (enviar correos, crear eventos, etc.).</p><p>Actualmente Marc <b>no tiene ninguna integración conectada</b> todavía.</p>`,
  src:"§4 · Integraciones"},
 {id:"plan",kw:["plan","explorer","limites","limitaciones","incluye","builder","architect","precio","cuanto"],
  html:`<h4>Plan Explorer</h4><p>Marc está en el plan <b>Explorer</b>. Esto es lo que entra y lo que no:</p>
   <table><tr><th>Incluye</th><th>No incluye</th></tr>
   <tr><td>Zoey + hasta 3 companions</td><td>Automatizaciones (cron/webhook)</td></tr>
   <tr><td>Herramientas básicas (búsqueda, conocimiento, memoria)</td><td>Skills personalizados</td></tr>
   <tr><td>—</td><td>Integraciones custom (API/MCP)</td></tr></table>
   <p style="margin-top:8px">Esas funciones avanzadas están en los planes superiores, <b>Builder</b> y <b>Architect</b>.</p>`,
  src:"§5 · Plan"},
 {id:"internet",kw:["internet","web","paginas","youtube","tiktok","instagram","transcribir","videos","tiempo real","buscar en internet"],
  html:`<h4>Internet y contenido externo</h4><p>Zoey puede <b>buscar en internet en tiempo real</b>, leer páginas web completas y <b>transcribir vídeos</b> de YouTube, TikTok, Instagram u otras plataformas. Con herramientas conectadas, puede ejecutar acciones directas (enviar, crear, modificar).</p>`,
  src:"§6 · Internet"},
 {id:"macapp",kw:["app nativa","mac","compilar","codigo","executable","app","aplicacion","electron","dock","webcatalog","unite",".app","instalar"],
  html:`<h4>¿Puede crear una app nativa de Mac?</h4><p><b>No.</b> Zoey no puede generar ejecutables (.app), compilar código ni entregar una aplicación nativa lista para instalar.</p><p>Lo que <b>sí</b> puede hacer:</p><ul><li>Preparar todo el código y los archivos de un proyecto (ej. el proyecto Electron guardado en la base de conocimiento).</li><li>Guiar paso a paso la ejecución en la terminal (VSCode, <code>npm install</code>, <code>npm start</code>…).</li><li>Explicar alternativas sin código: «Añadir al Dock» en Safari, o WebCatalog/Unite para convertir una web en app de escritorio en minutos.</li></ul>`,
  src:"§7 · App de Mac"},
 {id:"voz",kw:["voz","hablar","audio","transcripcion","personalidad de voz","microfono","canal"],
  html:`<h4>Cómo funciona la voz</h4><p>Al usar voz solo cambia el <b>canal de entrada/salida</b>: el audio se convierte a texto, Zoey lo procesa igual que un mensaje escrito y la respuesta se convierte de vuelta a audio. <b>No hay una «personalidad de voz» distinta</b>: el contenido y la lógica son los mismos.</p><p>A veces las transcripciones generan errores o fragmentos sueltos por ruido de reconocimiento.</p>`,
  src:"§8 · Voz"},
 {id:"proceso",kw:["como llega","respuestas","proceso","precision","inventa","confidencial","reversible","irreversible","confirma","decide"],
  html:`<h4>Cómo llega Zoey a sus respuestas</h4><p>Los detalles internos son confidenciales. Lo transparente:</p><ul><li>Interpreta la petición y decide si la resuelve ella con una herramienta (buscar, leer web, guardar) o la <b>delega</b> a un companion.</li><li><b>No inventa</b>: si necesita un dato, usa una herramienta real antes de responder.</li><li>Principio de precisión: si no lo sabe o no lo confirma una herramienta, lo dice.</li><li>Acciones reversibles (buscar, leer) se ejecutan directas; las irreversibles (borrar, enviar) <b>se confirman</b> antes.</li></ul>`,
  src:"§9 · Proceso"},
 {id:"alpha",kw:["alphavision","app de escritorio","proyecto electron","main.js","package.json","referencia"],
  html:`<h4>Referencia: AlphaVision AI</h4><p>Proyecto relacionado guardado en la base de conocimiento: <b>«AlphaVision AI — App de Escritorio para Mac (Electron)»</b>, con el código (main.js, package.json) e instrucciones paso a paso para ejecutarlo en local.</p>`,
  src:"Referencias"},
];

/* normalise: lower + strip accents */
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function retrieve(q){
  const nq=norm(q), words=nq.split(/[^a-z0-9]+/).filter(w=>w.length>2);
  let best=null,bs=0;
  for(const e of KB){
    let s=0;
    for(const k of e.kw){
      const nk=norm(k);
      if(nq.includes(nk)) s+= nk.includes(" ")?4:2;
      for(const w of words) if(nk.includes(w)||w.includes(nk)) s+=1;
    }
    if(s>bs){bs=s;best=e;}
  }
  return bs>=2?best:null;
}

/* ============ CHAT UI ============ */
const log=document.getElementById("log");
function bubble(who,html){
  const m=document.createElement("div");m.className="msg "+who;
  m.innerHTML=`<div class="who">${who==="ai"?"Y":"M"}</div><div class="bubble">${html}</div>`;
  log.appendChild(m);log.scrollTop=log.scrollHeight;return m.querySelector(".bubble");
}
function speak(text){
  if(!document.getElementById("voice").checked||!("speechSynthesis"in window))return;
  const u=new SpeechSynthesisUtterance(text.replace(/\s+/g," ").trim());
  u.lang="es-ES";u.rate=1.03;u.pitch=.9;
  const v=speechSynthesis.getVoices().find(v=>/es/i.test(v.lang));if(v)u.voice=v;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
/* type-in the html by revealing wrapper (simple + safe) */
function aiRespond(entry,plainForVoice){
  setState(true);
  const b=bubble("ai","");b.classList.add("cursor");
  const finalHTML=entry.html+`<div class="src">FUENTE · ${entry.src}</div>`;
  // reveal in a few steps for a "thinking" feel without breaking markup
  let step=0;const steps=6;
  const iv=setInterval(()=>{
    step++;
    if(step>=steps){clearInterval(iv);b.classList.remove("cursor");b.innerHTML=finalHTML;
      log.scrollTop=log.scrollHeight;setTimeout(()=>setState(false),700);
      speak(plainForVoice);}
  }, reduce?40:150);
}
function tmpText(entry){
  const d=document.createElement("div");d.innerHTML=entry.html;return d.textContent;
}

const fallback={
  html:`<h4>No lo tengo en el informe</h4><p>Solo respondo con lo documentado sobre <b>Zoey OS</b>. Prueba con: qué es Zoey, companions y bots, base de conocimiento, memoria, integraciones, plan Explorer, internet/voz, o si puede crear una app de Mac.</p>`,
  src:"YARVIS"};

function handle(q){
  bubble("me",q.replace(/</g,"&lt;"));
  const nq=norm(q);
  if(/^(hola|hey|buenas|hi|que tal|como estas)\b/.test(nq)){
    const e={html:`<p>Buenas, Marc. Soy <b>YARVIS</b>, tu núcleo. He indexado el informe de Zoey OS: pregúntame por companions, memoria, integraciones, tu plan Explorer o lo de la app de Mac.</p>`,src:"YARVIS"};
    return aiRespond(e, tmpText(e));
  }
  if(/(gracias|thanks|genial|perfecto)\b/.test(nq)){
    const e={html:`<p>A tus órdenes. Sigo en línea si necesitas algo más de Zoey OS.</p>`,src:"YARVIS"};
    return aiRespond(e, tmpText(e));
  }
  const hit=retrieve(q)||fallback;
  aiRespond(hit, tmpText(hit));
}

const form=document.getElementById("form"),input=document.getElementById("input");
form.addEventListener("submit",e=>{e.preventDefault();const v=input.value.trim();if(!v)return;input.value="";handle(v);});

/* suggestion chips */
const CHIPS=["¿Qué es Zoey?","Companions y bots","Base de conocimiento","¿Qué es la memoria?","Integraciones","Mi plan Explorer","¿Puede crear una app de Mac?","¿Cómo funciona la voz?"];
const chipsEl=document.getElementById("chips");
CHIPS.forEach(c=>{const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=c;
  b.onclick=()=>handle(c);chipsEl.appendChild(b);});

const boot=document.getElementById("boot");
const lines=[
  ["> inicializando núcleo YARVIS ...","b"],
  ["  cargando informe: Cómo funciona Zoey OS","" ],
  ["  indexando base de conocimiento .............. OK","ok"],
  ["  sincronizando memoria de usuario (Marc) ..... OK","ok"],
  ["  companions detectados: 1 · bots: 0/10","" ],
  ["  plan: Explorer · integraciones: 0","" ],
  ["> YARVIS ONLINE","b"],
];
let li=0;
function bootStep(){
  if(li>=lines.length){
    setTimeout(()=>{boot.classList.add("done");
      const e={html:`<p>Núcleo en línea. Soy <b>YARVIS</b> y conozco todo el informe de <b>Zoey OS</b>. ¿Qué quieres saber, Marc?</p>`,src:"YARVIS"};
      aiRespond(e,tmpText(e));},600);
    return;
  }
  const [t,cls]=lines[li++];
  const d=document.createElement("div");if(cls)d.className=cls;d.textContent=t;
  boot.appendChild(d);setTimeout(bootStep, reduce?90:340);
}
bootStep();
if("speechSynthesis"in window)speechSynthesis.getVoices();
